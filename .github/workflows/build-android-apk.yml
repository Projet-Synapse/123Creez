name: Android APK (build direct, sans compte Expo)

# ─────────────────────────────────────────────────────────────────────────
# Construit l'APK Android directement sur le runner GitHub (Gradle + SDK
# installés à la volée), sans compte Expo ni EXPO_TOKEN.
#
# Déclenchement : manuel (workflow_dispatch) ou pousser un tag v*.
# L'APK est :
#   • téléchargeable dans l'onglet Actions (artefact « 123Creez-apk ») ;
#   • joint à la release GitHub quand le déclenchement est un tag. La release
#     est normalement créée par le workflow desktop (electron-builder) : on
#     l'attend jusqu'à 30 min, puis on la crée nous-mêmes pour ne pas perdre
#     l'APK si le build desktop a échoué.
#
# Signature : expo prebuild génère un debug.keystore et signe la version
# « release » avec lui par défaut : l'APK s'installe sur tout appareil
# (« sources inconnues »). Pour le Play Store, créer un vrai keystore et
# renseigner signingConfigs.
#
# Garde-fous (après une série d'échecs runners en 10/2026) :
#   • cache Gradle — les re-builds repartent des dépendances déjà là ;
#   • lintVital exclu — l'analyse Play Store saturait la mémoire du runner ;
#   • codegen pré-généré + 2e essai automatique — la configuration CMake
#     peut tomber sur une cible « react_codegen_* » pas encore créée ;
#   • timeouts par étape (45 min) — un build figé est coupé et relancé au
#     lieu de faire attendre le job jusqu'à son terme (6 h par défaut) ;
#   • runs concurrents annulés — un nouveau push supprime l'attente inutile.
# ─────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      # Le bundle Metro de production tient mal dans la mémoire Node par
      # défaut d'un runner GitHub.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Le runner GitHub a déjà le SDK Android préinstallé (ANDROID_HOME) ;
      # l'action setup-android@v3 est cassée depuis la disparition du paquet
      # « tools » (cmdline-tools 16.0) — on se contente d'accepter les
      # licences avec le sdkmanager déjà présent.
      - name: Accepter les licences du SDK Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Générer le projet natif Android (expo prebuild)
        run: npx expo prebuild --platform android --no-install

      # Signature auto-signée : le template Expo signe la version « release »
      # avec android/app/debug.keystore (alias androiddebugkey / mots de passe
      # « android ») — on remplace ce fichier par NOTRE clé commitée (mêmes
      # paramètres) : l'APK est signé avec l'identité 123Créez, stable d'un
      # build à l'autre, sans patcher le build.gradle généré.
      - name: Installer la clé de signature
        run: cp scripts/android/creez.keystore android/app/debug.keystore

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: gradle-${{ runner.os }}-

      # Pré-génère les artefacts codegen des turbo modules : sans ça, la
      # configuration CMake peut démarrer avant la création des cibles
      # « react_codegen_* » (race « Cannot specify link libraries »).
      - name: Pré-générer le codegen
        working-directory: android
        timeout-minutes: 20
        run: ./gradlew generateCodegenArtifactsFromSchema --no-daemon || true

      # --build-cache : si un essai meurt en cours de route, le suivant
      # réutilise les sorties des tâches déjà réussies (cache local).
      - name: Construire l'APK (essai 1)
        working-directory: android
        timeout-minutes: 45
        run: ./gradlew --build-cache assembleRelease -x lintVitalRelease -x lintVitalAnalyzeRelease -x lintVitalReportRelease --no-daemon

      - name: Construire l'APK (essai 2 après échec)
        if: failure()
        working-directory: android
        timeout-minutes: 45
        run: ./gradlew --build-cache assembleRelease -x lintVitalRelease -x lintVitalAnalyzeRelease -x lintVitalReportRelease --no-daemon

      - name: Renommer l'APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk 123Creez.apk
          ls -lh 123Creez.apk

      - name: Publier l'APK comme artefact de ce run
        uses: actions/upload-artifact@v4
        with:
          name: 123Creez-apk
          path: 123Creez.apk
          if-no-files-found: error

      - name: Joindre l'APK à la release (déclenchement par tag uniquement)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          for i in $(seq 1 30); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            sleep 60
          done
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "${TAG#v}" --generate-notes
          gh release upload "$TAG" 123Creez.apk --clobber
